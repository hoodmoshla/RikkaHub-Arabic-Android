name: Sync upstream and release Arabic APK

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: arabic-upstream-release
  cancel-in-progress: false

jobs:
  sync-build-release:
    runs-on: ubuntu-latest
    env:
      RELEASE_VERSION: 1.0.${{ github.run_number }}
      RELEASE_CODE: ${{ github.run_number }}
    steps:
      - name: Checkout Arabic fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Configure upstream
        if: github.event_name == 'schedule'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/rikkahub/rikkahub.git || true
          git fetch upstream master

      - name: Merge official upstream
        if: github.event_name == 'schedule'
        run: |
          echo "before=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          git merge upstream/master --no-edit

      - name: Detect source changes
        id: changed
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "$before" != "$(git rev-parse HEAD)" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate Arabic resource completeness
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          def keys(p):
              return set(re.findall(r'<string\s+name="([^"]+)"', Path(p).read_text()))
          base = keys('app/src/main/res/values/strings.xml')
          ar = keys('app/src/main/res/values-ar/strings.xml')
          missing = sorted(base - ar)
          if missing:
              raise SystemExit('Arabic translation missing keys:\n' + '\n'.join(missing))
          print(f'Arabic resource covers {len(base)} base strings')

      - name: Validate Arabic integration hooks
        run: |
          test -f app/src/main/res/values-ar/strings.xml
          grep -q 'AppLanguage.ARABIC' app/src/main/java/me/rerere/rikkahub/ui/pages/setting/SettingPreferencesGeneralPage.kt
          grep -q 'AppLocale.wrap' app/src/main/java/me/rerere/rikkahub/RouteActivity.kt
          grep -q 'android:supportsRtl="true"' app/src/main/AndroidManifest.xml

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web-ui/pnpm-lock.yaml

      - name: Install web-ui dependencies
        working-directory: web-ui
        run: pnpm install --frozen-lockfile

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run unit tests
        if: steps.changed.outputs.changed == 'true'
        run: ./gradlew test --no-daemon

      - name: Restore signing key
        if: steps.changed.outputs.changed == 'true'
        env:
          KEYSTORE_B64: ${{ secrets.ARABIC_RELEASE_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.ARABIC_RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ARABIC_RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ARABIC_RELEASE_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_B64" || (echo 'Missing Arabic release signing secrets' >&2; exit 1)
          echo "$KEYSTORE_B64" | base64 --decode > arabic-release.keystore
          cat >> local.properties <<EOF
          storeFile=$GITHUB_WORKSPACE/arabic-release.keystore
          storePassword=$STORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - name: Build signed universal APK
        if: steps.changed.outputs.changed == 'true'
        run: ./gradlew :app:assembleRelease -PreleaseVersion="$RELEASE_VERSION" -PreleaseCode="$RELEASE_CODE" -PreleaseSigned=true

      - name: Push validated upstream merge
        if: steps.changed.outputs.changed == 'true' && github.event_name == 'schedule'
        run: git push origin master

      - name: Upload APK artifact
        if: steps.changed.outputs.changed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: RikkaHub-Arabic-Release-APK
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Remove release-only files
        if: always()
        run: rm -f arabic-release.keystore local.properties
