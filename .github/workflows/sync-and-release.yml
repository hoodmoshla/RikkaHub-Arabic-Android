name: 'Final upstream delta: signed build and upgrade186 (no publication)'
permissions:
  contents: read
concurrency:
  group: final-upstream-5203601f
  cancel-in-progress: false
jobs:
  signed-upgrade186:
    if: github.ref == 'refs/heads/finish/upstream-5203601f' && inputs.publish_release == false && inputs.mode == 'build-only'
    runs-on: ubuntu-latest
    timeout-minutes: 65
    env:
      CANDIDATE_SHA: f74ee15d4d09deedc28623cbf9c467156a811612
      EXPECTED_CERT: 27326144bdee8eefa9cd7a39e80c3a5322e8332419b86d4b13cfecbbe9eb7b73
    steps:
    - name: Checkout temporary test branch
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        submodules: recursive
        persist-credentials: false
    - name: Guard exact candidate sources and inspect installed runner emulator
      shell: bash
      run: "set -euo pipefail\nmkdir -p upgrade-verification/metadata\ngit diff --exit-code \"$CANDIDATE_SHA\" HEAD -- . \":!.github\"\ngit rev-parse HEAD\
        \ > upgrade-verification/metadata/test-sha.txt\necho \"$CANDIDATE_SHA\" > upgrade-verification/metadata/candidate-sha.txt\nprintf 'ANDROID_HOME=%s\\\
        n' \"$ANDROID_HOME\" | tee upgrade-verification/metadata/runner-sdk.txt\nls -la \"$ANDROID_HOME\" >> upgrade-verification/metadata/runner-sdk.txt\n\
        command -v emulator >> upgrade-verification/metadata/runner-sdk.txt || true\ntest -e /dev/kvm\nsudo chmod 666 /dev/kvm\nif [ ! -x \"$ANDROID_HOME/emulator/emulator\"\
        \ ]; then\n  echo 'Installed runner SDK has no emulator executable; installing official SDK emulator component.' | tee -a upgrade-verification/metadata/runner-sdk.txt\n\
        \  \"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager\" --install emulator\nfi\ntest -x \"$ANDROID_HOME/emulator/emulator\"\nsudo apt-get update\
        \ -qq\nsudo apt-get install -y libpulse0 libasound2t64 libnss3 libx11-xcb1 libxcb-cursor0 libxkbcommon-x11-0\nldd \"$ANDROID_HOME/emulator/qemu/linux-x86_64/qemu-system-x86_64\"\
        \ > upgrade-verification/metadata/runner-emulator-libraries.txt\n\"$ANDROID_HOME/emulator/emulator\" -version | tee upgrade-verification/metadata/runner-emulator-version.txt\n\
        test -e /dev/kvm\nsudo chmod 666 /dev/kvm\n\"$ANDROID_HOME/emulator/emulator\" -accel-check | tee upgrade-verification/metadata/runner-acceleration.txt\n\
        printf 'mode=build-only\\npublish_release=false\\ncontents_permission=read\\nno_apk_upload=true\\n' > upgrade-verification/metadata/safety.txt\n"
    - uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '17'
    - uses: pnpm/action-setup@v4
      with:
        version: 11
    - uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: pnpm
        cache-dependency-path: web-ui/pnpm-lock.yaml
    - name: Install web-ui dependencies
      working-directory: web-ui
      run: pnpm install --frozen-lockfile
    - uses: gradle/actions/setup-gradle@v4
    - name: Prepare UI automation on runner
      run: python3 -m pip install uiautomator2
    - name: Fetch exact published stable APK 186
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: 'set -euo pipefail

        mkdir -p previous-apk

        gh release download v3.0.0.186 --repo hoodmoshla/RikkaHub-Arabic-Android --pattern app-universal-release.apk --dir previous-apk

        echo ''8487608c734e30e398cd568d75fc781fc9cf80af1d60c36e90e1df00f3e3d2fc  previous-apk/app-universal-release.apk'' | sha256sum -c -

        '
    - name: F) Validate Arabic resource completeness
      run: "python3 - <<'PY'\nimport re\nfrom pathlib import Path\ndef keys(p):\n    return set(re.findall(r'<string\\s+name=\"([^\"]+)\"', Path(p).read_text()))\n\
        base = keys('app/src/main/res/values/strings.xml')\nar = keys('app/src/main/res/values-ar/strings.xml')\nmissing = sorted(base - ar)\nif missing:\n\
        \    raise SystemExit('Arabic translation missing keys:\\n' + '\\n'.join(missing))\nprint(f'Arabic resource covers {len(base)} base strings')\n\
        PY\n"
    - name: G) Validate Arabic integration hooks and protected changes
      run: 'set -e

        test -f app/src/main/res/values-ar/strings.xml

        grep -q ''AppLanguage.ARABIC'' app/src/main/java/me/rerere/rikkahub/ui/pages/setting/SettingPreferencesGeneralPage.kt

        grep -q ''AppLocale.wrap'' app/src/main/java/me/rerere/rikkahub/RouteActivity.kt

        grep -q ''android:supportsRtl="true"'' app/src/main/AndroidManifest.xml

        grep -q ''applicationId = "me.rerere.rikkahub.arabic.dev"'' app/build.gradle.kts

        grep -q ''RIKKAHUB_PROVIDER_ID'' app/src/main/java/me/rerere/rikkahub/data/datastore/DefaultProviders.kt

        grep -q ''DEFAULT_AUTO_MODEL_ID'' app/src/main/java/me/rerere/rikkahub/data/datastore/DefaultProviders.kt

        grep -q ''hoodmoshla/RikkaHub-Arabic-Android'' app/src/main/java/me/rerere/rikkahub/utils/UpdateChecker.kt

        test -f app/src/main/java/me/rerere/rikkahub/utils/UpdateCheckWorker.kt

        grep -q ''fun Settings.getConversationAssistant(conversation: Conversation)'' app/src/main/java/me/rerere/rikkahub/data/datastore/PreferencesStore.kt

        grep -q ''fun Settings.resolveWorkspaceId(conversation: Conversation)'' app/src/main/java/me/rerere/rikkahub/data/datastore/PreferencesStore.kt

        grep -q ''fun Settings.resolveChatModel(conversation: Conversation)'' app/src/main/java/me/rerere/rikkahub/data/datastore/PreferencesStore.kt

        test -f app/src/test/java/me/rerere/rikkahub/data/datastore/ConversationScopedSettingsTest.kt

        echo "All protected Arabic-distribution changes are present."

        '
    - name: Targeted new agent and tool serialization tests
      run: ./gradlew :ai:test --tests "me.rerere.ai.agent.AgentLoopTest" --tests "me.rerere.ai.ui.UIMessagePartTest" --tests "me.rerere.ai.ui.UIMessageSerializationTest"
        --tests "me.rerere.ai.ui.MessageToolMigrationTest" --no-daemon
    - name: Targeted conversation tool cancellation and persistence tests
      run: ./gradlew :app:testDebugUnitTest --tests "me.rerere.rikkahub.data.model.ConversationMessagesTest" --tests "me.rerere.rikkahub.data.model.ConversationToolCallsTest"
        --tests "me.rerere.rikkahub.data.repository.ConversationPersistenceTest" --tests "me.rerere.rikkahub.data.datastore.ProviderConfigurationLifecycleTest"
        --no-daemon
    - name: Lint changed release UI and source integration
      run: ./gradlew :app:lintRelease --no-daemon
    - name: Verify unchanged Room migration sources against tested baseline
      run: git diff --exit-code 200d3a87 HEAD -- app/schemas app/src/main/java/me/rerere/rikkahub/data/db app/src/androidTest/java/me/rerere/rikkahub/data/db
    - name: Restore existing Arabic release key for test only
      env:
        KEYSTORE_B64: ${{ secrets.ARABIC_DEV_KEYSTORE_B64 }}
        STORE_PASSWORD: ${{ secrets.ARABIC_DEV_STORE_PASSWORD }}
        KEY_ALIAS: ${{ secrets.ARABIC_DEV_KEY_ALIAS }}
        KEY_PASSWORD: ${{ secrets.ARABIC_DEV_KEY_PASSWORD }}
      run: 'set -euo pipefail

        umask 077

        test -n "$KEYSTORE_B64" && test -n "$STORE_PASSWORD" && test -n "$KEY_ALIAS" && test -n "$KEY_PASSWORD"

        printf ''%s'' "$KEYSTORE_B64" | base64 --decode > arabic-release.keystore

        printf ''storeFile=%s/arabic-release.keystore\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n'' "$GITHUB_WORKSPACE" "$STORE_PASSWORD" "$KEY_ALIAS"
        "$KEY_PASSWORD" >> local.properties

        '
    - name: Build exact candidate signed APK without publication
      run: ./gradlew :app:assembleRelease -PreleaseVersion=3.0.0.193 -PreleaseCode=193 -PreleaseSigned=true --no-daemon
    - name: Verify identities and original certificate on both APK files
      shell: bash
      run: "set -euo pipefail\nBT=$(find \"$ANDROID_HOME/build-tools\" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)\nfor label in stable candidate;\
        \ do\n  if [ \"$label\" = stable ]; then apk=previous-apk/app-universal-release.apk; expected=186; else apk=app/build/outputs/apk/release/app-universal-release.apk;\
        \ expected=193; fi\n  \"$BT/apksigner\" verify --print-certs \"$apk\" > \"upgrade-verification/metadata/$label-signature.txt\"\n  cert=$(awk -F':\
        \ ' '/certificate SHA-256 digest:/ {print $NF}' \"upgrade-verification/metadata/$label-signature.txt\" | tr -d ':' | tr '[:upper:]' '[:lower:]'\
        \ | sort -u)\n  test \"$cert\" = \"$EXPECTED_CERT\"\n  \"$BT/aapt\" dump badging \"$apk\" > \"upgrade-verification/metadata/$label-package.txt\"\
        \n  grep -q \"^package: name='me.rerere.rikkahub.arabic.dev' versionCode='$expected'\" \"upgrade-verification/metadata/$label-package.txt\"\n  sha256sum\
        \ \"$apk\" >> upgrade-verification/metadata/apk-sha256.txt\ndone\nrm -f arabic-release.keystore local.properties\n"
    - name: Build read-only Android verifier using exact APK native libraries
      shell: bash
      run: 'set -euo pipefail

        mkdir -p upgrade-native/stable upgrade-native/candidate

        NDK_CC=$(find "$ANDROID_HOME/ndk" -name x86_64-linux-android26-clang | sort -V | tail -1)

        test -x "$NDK_CC"

        "$NDK_CC" -std=c11 -O2 -Wall -Wextra .github/scripts/android-db-check.c -ldl -o upgrade-native/android-db-check

        unzip -j previous-apk/app-universal-release.apk lib/x86_64/libsqlite3x.so lib/x86_64/libsimple.so -d upgrade-native/stable

        unzip -j app/build/outputs/apk/release/app-universal-release.apk lib/x86_64/libsqlite3x.so lib/x86_64/libsimple.so -d upgrade-native/candidate

        sha256sum upgrade-native/android-db-check upgrade-native/stable/*.so upgrade-native/candidate/*.so > upgrade-verification/metadata/native-library-sha256.txt

        echo ''Exact native libraries extracted from each signed APK; Android verifier opens copied DB read-only; original app database is not modified.''
        > upgrade-verification/metadata/native-verifier.txt

        '
    - name: Actual replacement upgrade then UI message send
      uses: reactivecircus/android-emulator-runner@v2
      with:
        api-level: 35
        target: google_apis
        arch: x86_64
        profile: pixel_2
        disable-animations: true
        emulator-options: -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect -camera-back none
        script: 'bash .github/scripts/verify-upgrade186.sh

          python3 .github/scripts/send-after-upgrade.py

          '
    - name: Summarize actual result only
      if: always()
      shell: bash
      run: "{\n  echo '## Temporary signed upgrade186 test: no publication'\n  echo 'Candidate production source: f74ee15d4d09deedc28623cbf9c467156a811612'\n\
        \  echo 'Send test uses local mock OpenAI endpoint, not external AI service.'\n  echo 'No release, merge, or Git push step exists; verified APK\
        \ staged for authorized release.'\n  find upgrade-verification \\( -name '*result*.json' -o -name result.txt \\) | while read -r f; do echo \"###\
        \ $f\"; cat \"$f\"; done\n} >> \"$GITHUB_STEP_SUMMARY\"\n"
    - name: Upload synthetic evidence only, never APK or signing files
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: signed-upgrade186-evidence
        path: upgrade-verification/
        retention-days: 14
        if-no-files-found: error
    - name: Stage exact verified signed universal APK
      uses: actions/upload-artifact@v4
      with:
        name: RikkaHub-Arabic-Release-APK-193
        path: app/build/outputs/apk/release/app-universal-release.apk
        if-no-files-found: error
    - name: Upload targeted test and lint reports
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: delta-test-lint-reports
        path: '**/build/test-results/

          app/build/reports/lint-results*'
        if-no-files-found: warn
    - name: Remove test APK and signing files
      if: always()
      run: rm -f arabic-release.keystore local.properties app/build/outputs/apk/release/*.apk previous-apk/*.apk
'on':
  workflow_dispatch:
    inputs:
      publish_release:
        type: boolean
        default: false
        description: Must remain false
      mode:
        type: choice
        options:
        - build-only
        default: build-only
