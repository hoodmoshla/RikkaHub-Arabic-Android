name: Temporary signed upgrade186 end-to-end (no publication)
on:
  workflow_dispatch:
    inputs:
      publish_release:
        type: boolean
        default: false
        description: Must remain false
      mode:
        type: choice
        options: [build-only]
        default: build-only
permissions:
  contents: read
concurrency:
  group: temporary-upgrade186-${{ github.ref }}
  cancel-in-progress: false
jobs:
  signed-upgrade186:
    if: github.ref == 'refs/heads/test/upgrade186-e2e-20261020' && inputs.publish_release == false && inputs.mode == 'build-only'
    runs-on: ubuntu-latest
    timeout-minutes: 65
    env:
      CANDIDATE_SHA: fb80c8b060de71a7901838fb352fd11fa6f685a1
      EXPECTED_CERT: 27326144bdee8eefa9cd7a39e80c3a5322e8332419b86d4b13cfecbbe9eb7b73
    steps:
      - name: Checkout temporary test branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false
      - name: Guard exact candidate sources and inspect installed runner emulator
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p upgrade-verification/metadata
          git diff --exit-code "$CANDIDATE_SHA" HEAD -- . ':!.github/workflows/sync-and-release.yml' ':!.github/scripts/verify-upgrade186.sh' ':!.github/scripts/upgrade186-data.py' ':!.github/scripts/send-after-upgrade.py'
          git rev-parse HEAD > upgrade-verification/metadata/test-sha.txt
          echo "$CANDIDATE_SHA" > upgrade-verification/metadata/candidate-sha.txt
          printf 'ANDROID_HOME=%s\n' "$ANDROID_HOME" | tee upgrade-verification/metadata/runner-sdk.txt
          ls -la "$ANDROID_HOME" >> upgrade-verification/metadata/runner-sdk.txt
          command -v emulator >> upgrade-verification/metadata/runner-sdk.txt || true
          test -e /dev/kvm
          sudo chmod 666 /dev/kvm
          if [ ! -x "$ANDROID_HOME/emulator/emulator" ]; then
            echo 'Installed runner SDK has no emulator executable; installing official SDK emulator component.' | tee -a upgrade-verification/metadata/runner-sdk.txt
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install emulator
          fi
          test -x "$ANDROID_HOME/emulator/emulator"
          sudo apt-get update -qq
          sudo apt-get install -y libpulse0 libasound2t64 libnss3 libx11-xcb1 libxcb-cursor0 libxkbcommon-x11-0
          ldd "$ANDROID_HOME/emulator/qemu/linux-x86_64/qemu-system-x86_64" > upgrade-verification/metadata/runner-emulator-libraries.txt
          "$ANDROID_HOME/emulator/emulator" -version | tee upgrade-verification/metadata/runner-emulator-version.txt
          test -e /dev/kvm
          sudo chmod 666 /dev/kvm
          "$ANDROID_HOME/emulator/emulator" -accel-check | tee upgrade-verification/metadata/runner-acceleration.txt
          printf 'mode=build-only\npublish_release=false\ncontents_permission=read\nno_apk_upload=true\n' > upgrade-verification/metadata/safety.txt
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web-ui/pnpm-lock.yaml
      - name: Install web-ui dependencies
        working-directory: web-ui
        run: pnpm install --frozen-lockfile
      - uses: gradle/actions/setup-gradle@v4
      - name: Prepare UI automation on runner
        run: python3 -m pip install uiautomator2
      - name: Fetch exact published stable APK 186
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p previous-apk
          gh release download v3.0.0.186 --repo hoodmoshla/RikkaHub-Arabic-Android --pattern app-universal-release.apk --dir previous-apk
          echo '8487608c734e30e398cd568d75fc781fc9cf80af1d60c36e90e1df00f3e3d2fc  previous-apk/app-universal-release.apk' | sha256sum -c -
      - name: Restore existing Arabic release key for test only
        env:
          KEYSTORE_B64: ${{ secrets.ARABIC_DEV_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.ARABIC_DEV_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ARABIC_DEV_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ARABIC_DEV_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$KEYSTORE_B64" && test -n "$STORE_PASSWORD" && test -n "$KEY_ALIAS" && test -n "$KEY_PASSWORD"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > arabic-release.keystore
          printf 'storeFile=%s/arabic-release.keystore\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' "$GITHUB_WORKSPACE" "$STORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" >> local.properties
      - name: Build exact candidate signed APK without publication
        run: ./gradlew :app:assembleRelease -PreleaseVersion=3.0.0.192 -PreleaseCode=192 -PreleaseSigned=true --no-daemon
      - name: Verify identities and original certificate on both APK files
        shell: bash
        run: |
          set -euo pipefail
          BT=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          for label in stable candidate; do
            if [ "$label" = stable ]; then apk=previous-apk/app-universal-release.apk; expected=186; else apk=app/build/outputs/apk/release/app-universal-release.apk; expected=192; fi
            "$BT/apksigner" verify --print-certs "$apk" > "upgrade-verification/metadata/$label-signature.txt"
            cert=$(awk -F': ' '/certificate SHA-256 digest:/ {print $NF}' "upgrade-verification/metadata/$label-signature.txt" | tr -d ':' | tr '[:upper:]' '[:lower:]' | sort -u)
            test "$cert" = "$EXPECTED_CERT"
            "$BT/aapt" dump badging "$apk" > "upgrade-verification/metadata/$label-package.txt"
            grep -q "^package: name='me.rerere.rikkahub.arabic.dev' versionCode='$expected'" "upgrade-verification/metadata/$label-package.txt"
            sha256sum "$apk" >> upgrade-verification/metadata/apk-sha256.txt
          done
          rm -f arabic-release.keystore local.properties
      - name: Actual replacement upgrade then UI message send
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect -camera-back none
          script: |
            bash .github/scripts/verify-upgrade186.sh
            python3 .github/scripts/send-after-upgrade.py
      - name: Summarize actual result only
        if: always()
        shell: bash
        run: |
          {
            echo '## Temporary signed upgrade186 test: no publication'
            echo 'Candidate production source: fb80c8b060de71a7901838fb352fd11fa6f685a1'
            echo 'Send test uses local mock OpenAI endpoint, not external AI service.'
            echo 'No APK upload, release, merge, or Git push step exists.'
            find upgrade-verification \( -name '*result*.json' -o -name result.txt \) | while read -r f; do echo "### $f"; cat "$f"; done
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload synthetic evidence only, never APK or signing files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: signed-upgrade186-evidence
          path: upgrade-verification/
          retention-days: 14
          if-no-files-found: error
      - name: Remove test APK and signing files
        if: always()
        run: rm -f arabic-release.keystore local.properties app/build/outputs/apk/release/*.apk previous-apk/*.apk
