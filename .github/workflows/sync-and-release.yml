name: Sync upstream and release Arabic APK

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      sync_upstream:
        description: 'Fetch and attempt to merge latest upstream master'
        required: false
        type: boolean
        default: true
      force_build:
        description: 'Force build and release even if no new upstream commits'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: arabic-upstream-release
  cancel-in-progress: false

jobs:
  sync-build-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Arabic fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Configure Git identity
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Configure upstream
        run: |
          git remote add upstream https://github.com/rikkahub/rikkahub.git || true
          git fetch upstream master --tags

      - name: Check upstream for updates
        id: check_upstream
        run: |
          UPSTREAM_HEAD=$(git rev-parse upstream/master)
          LOCAL_HEAD=$(git rev-parse HEAD)
          MERGE_BASE=$(git merge-base upstream/master HEAD)

          echo "Upstream HEAD: $UPSTREAM_HEAD"
          echo "Local HEAD:    $LOCAL_HEAD"
          echo "Merge Base:    $MERGE_BASE"

          HAS_NEW_UPSTREAM="false"
          if [ "$UPSTREAM_HEAD" != "$MERGE_BASE" ]; then
            HAS_NEW_UPSTREAM="true"
            echo "New upstream commits detected!"
          else
            echo "No new upstream commits."
          fi

          FORCE_BUILD="${{ github.event.inputs.force_build == 'true' }}"
          SHOULD_SYNC="${{ github.event_name == 'schedule' || github.event.inputs.sync_upstream == 'true' }}"

          SHOULD_PROCEED="false"
          if [ "$FORCE_BUILD" = "true" ]; then
            SHOULD_PROCEED="true"
            echo "Build explicitly forced via workflow_dispatch."
          elif [ "$HAS_NEW_UPSTREAM" = "true" ] && [ "$SHOULD_SYNC" = "true" ]; then
            SHOULD_PROCEED="true"
            echo "Upstream updates detected; proceeding with sync and build."
          else
            echo "No new upstream changes and build not forced. Halting workflow cleanly without Merge, Build, or Release."
          fi

          echo "has_new_upstream=$HAS_NEW_UPSTREAM" >> "$GITHUB_OUTPUT"
          echo "should_sync=$SHOULD_SYNC" >> "$GITHUB_OUTPUT"
          echo "should_proceed=$SHOULD_PROCEED" >> "$GITHUB_OUTPUT"

      - name: Detect and merge official upstream
        id: merge_step
        if: steps.check_upstream.outputs.should_proceed == 'true' && steps.check_upstream.outputs.should_sync == 'true' && steps.check_upstream.outputs.has_new_upstream == 'true'
        run: |
          echo "Attempting merge with upstream/master..."
          if ! git merge upstream/master --no-commit --no-ff; then
            echo "::error::Merge conflict encountered when merging upstream/master"
            CONFLICT_FILES=$(git diff --name-only --diff-filter=U)
            echo "Conflicted files:"
            echo "$CONFLICT_FILES"

            # Sensitive files that must NEVER be blindly overwritten or conflicted
            SENSITIVE_PATTERNS="values-ar/|AppLocale\.kt|SettingPreferencesGeneralPage\.kt|DefaultProviders\.kt|app/build\.gradle\.kts|AndroidManifest\.xml|RouteActivity\.kt|UpdateChecker\.kt|UpdateCard\.kt|UpdateDownloadReceiver\.kt"

            SENSITIVE_CONFLICTS=$(echo "$CONFLICT_FILES" | grep -E "$SENSITIVE_PATTERNS" || true)
            if [ -n "$SENSITIVE_CONFLICTS" ]; then
              echo "::error::CRITICAL: Sensitive files in Arabic distribution have merge conflicts:"
              echo "$SENSITIVE_CONFLICTS"
              echo "Aborting merge to prevent breaking Arabic localization, RTL, Provider, or App configuration."
              git merge --abort
              exit 1
            else
              echo "::error::Non-sensitive merge conflicts detected. Aborting merge."
              git merge --abort
              exit 1
            fi
          else
            git commit -m "chore(upstream): sync and merge upstream/master ($(git rev-parse --short upstream/master))"
            echo "merged_upstream=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Determine Release Version
        id: version_step
        if: steps.check_upstream.outputs.should_proceed == 'true'
        run: |
          UPSTREAM_TAG=$(git describe --tags --match "[0-9]*" --abbrev=0 upstream/master 2>/dev/null || echo "2.5.1")
          BASE_VERSION=$(echo "$UPSTREAM_TAG" | sed 's/^v//')
          RUN_NUM="${{ github.run_number }}"
          RELEASE_VERSION="${BASE_VERSION}.${RUN_NUM}"
          RELEASE_CODE="${RUN_NUM}"
          echo "release_version=$RELEASE_VERSION" >> "$GITHUB_OUTPUT"
          echo "release_code=$RELEASE_CODE" >> "$GITHUB_OUTPUT"
          echo "Resolved Release Version: $RELEASE_VERSION (code $RELEASE_CODE)"

      - name: Validate Arabic resource completeness
        if: steps.check_upstream.outputs.should_proceed == 'true'
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          def keys(p):
              return set(re.findall(r'<string\s+name="([^"]+)"', Path(p).read_text()))
          base = keys('app/src/main/res/values/strings.xml')
          ar = keys('app/src/main/res/values-ar/strings.xml')
          missing = sorted(base - ar)
          if missing:
              raise SystemExit('Arabic translation missing keys:\n' + '\n'.join(missing))
          print(f'Arabic resource covers {len(base)} base strings')
          PY

      - name: Validate Arabic integration hooks and Provider architecture
        if: steps.check_upstream.outputs.should_proceed == 'true'
        run: |
          test -f app/src/main/res/values-ar/strings.xml
          grep -q 'AppLanguage.ARABIC' app/src/main/java/me/rerere/rikkahub/ui/pages/setting/SettingPreferencesGeneralPage.kt
          grep -q 'AppLocale.wrap' app/src/main/java/me/rerere/rikkahub/RouteActivity.kt
          grep -q 'android:supportsRtl="true"' app/src/main/AndroidManifest.xml
          grep -q 'applicationId = "me.rerere.rikkahub.arabic.dev"' app/build.gradle.kts
          grep -q 'RIKKAHUB_PROVIDER_ID' app/src/main/java/me/rerere/rikkahub/data/datastore/DefaultProviders.kt
          grep -q 'DEFAULT_AUTO_MODEL_ID' app/src/main/java/me/rerere/rikkahub/data/datastore/DefaultProviders.kt
          echo "All critical Arabic integration hooks and provider configurations validated."

      - name: Set up Java
        if: steps.check_upstream.outputs.should_proceed == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up pnpm
        if: steps.check_upstream.outputs.should_proceed == 'true'
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Set up Node
        if: steps.check_upstream.outputs.should_proceed == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web-ui/pnpm-lock.yaml

      - name: Install web-ui dependencies
        if: steps.check_upstream.outputs.should_proceed == 'true'
        working-directory: web-ui
        run: pnpm install --frozen-lockfile

      - name: Set up Gradle
        if: steps.check_upstream.outputs.should_proceed == 'true'
        uses: gradle/actions/setup-gradle@v4

      - name: Run JVM unit tests
        if: steps.check_upstream.outputs.should_proceed == 'true'
        run: ./gradlew test --no-daemon

      - name: Restore signing key
        if: steps.check_upstream.outputs.should_proceed == 'true'
        env:
          KEYSTORE_B64: ${{ secrets.ARABIC_DEV_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.ARABIC_DEV_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ARABIC_DEV_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ARABIC_DEV_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_B64" || (echo 'Missing Arabic dev release signing secrets' >&2; exit 1)
          echo "$KEYSTORE_B64" | base64 --decode > arabic-release.keystore
          cat >> local.properties <<EOF
          storeFile=$GITHUB_WORKSPACE/arabic-release.keystore
          storePassword=$STORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF
          keytool -list -v -keystore arabic-release.keystore -storepass "$STORE_PASSWORD"

      - name: Build signed universal APK
        if: steps.check_upstream.outputs.should_proceed == 'true'
        env:
          RELEASE_VERSION: ${{ steps.version_step.outputs.release_version }}
          RELEASE_CODE: ${{ steps.version_step.outputs.release_code }}
        run: ./gradlew :app:assembleRelease -PreleaseVersion="$RELEASE_VERSION" -PreleaseCode="$RELEASE_CODE" -PreleaseSigned=true

      - name: Verify generated APK integrity
        if: steps.check_upstream.outputs.should_proceed == 'true'
        run: |
          python3 - <<'PY'
          import zipfile, struct, hashlib, os, sys

          apk_path = "app/build/outputs/apk/release/app-universal-release.apk"
          if not os.path.exists(apk_path):
              sys.exit(f"APK not found at {apk_path}")

          print(f"Checking APK: {apk_path} ({os.path.getsize(apk_path):,} bytes)")

          with open(apk_path, "rb") as f:
              data = f.read()

          idx = data.find(b"APK Sig Block 42")
          if idx == -1:
              sys.exit("Error: APK Signature Block not found!")

          block_size = struct.unpack("<Q", data[idx-8:idx])[0]
          block_start = idx + 8 - block_size
          pos = block_start + 8

          cert_sha256 = None
          while pos < idx - 8:
              pair_len = struct.unpack("<Q", data[pos:pos+8])[0]
              pair_id = struct.unpack("<I", data[pos+8:pos+12])[0]
              val = data[pos+12:pos+8+pair_len]
              if pair_id == 0x7109871a: # v2 scheme
                  signer_len = struct.unpack_from("<I", val, 4)[0]
                  signer = val[8:8+signer_len]
                  signed_data_len = struct.unpack_from("<I", signer, 0)[0]
                  signed_data = signer[4:4+signed_data_len]
                  sd_offset = 4 + struct.unpack_from("<I", signed_data, 0)[0]
                  certs_len = struct.unpack_from("<I", signed_data, sd_offset)[0]
                  cert_len = struct.unpack_from("<I", signed_data, sd_offset+4)[0]
                  cert_der = signed_data[sd_offset+8:sd_offset+8+cert_len]
                  raw_sha = hashlib.sha256(cert_der).hexdigest()
                  cert_sha256 = ":".join(raw_sha[i:i+2].upper() for i in range(0, len(raw_sha), 2))
              pos += 8 + pair_len

          EXPECTED_SHA = "27:32:61:44:BD:EE:8E:EF:A9:CD:7A:39:E8:0C:3A:53:22:E8:33:24:19:B8:6D:4B:13:CF:EC:BB:E9:EB:7B:73"
          print(f"Verified Cert SHA-256: {cert_sha256}")
          if cert_sha256 != EXPECTED_SHA:
              sys.exit(f"Error: Cert SHA mismatch! Got {cert_sha256}, expected {EXPECTED_SHA}")

          with zipfile.ZipFile(apk_path) as z:
              manifest = z.read("AndroidManifest.xml")
              if "me.rerere.rikkahub.arabic.dev".encode("utf-16le") not in manifest:
                  sys.exit("Error: Manifest does not contain applicationId me.rerere.rikkahub.arabic.dev")

          print("All APK binary verifications passed successfully!")
          PY

      - name: Push validated upstream merge
        if: steps.check_upstream.outputs.should_proceed == 'true' && steps.merge_step.outputs.merged_upstream == 'true'
        run: git push origin master

      - name: Upload APK artifact
        if: steps.check_upstream.outputs.should_proceed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: RikkaHub-Arabic-Release-APK
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Publish GitHub Release
        if: steps.check_upstream.outputs.should_proceed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ steps.version_step.outputs.release_version }}
        run: |
          TAG_NAME="v${RELEASE_VERSION}"
          RELEASE_TITLE="RikkaHub Arabic ${TAG_NAME}"
          NOTES="### RikkaHub Arabic ${TAG_NAME}

          تحديث رسمي لنسخة RikkaHub Arabic المستقلة.

          - **Application ID:** \`me.rerere.rikkahub.arabic.dev\`
          - **التوقيع الرقمي:** Keystore دائم (SHA-256: \`27:32:61:44:BD:EE:8E:EF:A9:CD:7A:39:E8:0C:3A:53:22:E8:33:24:19:B8:6D:4B:13:CF:EC:BB:E9:EB:7B:73\`)
          - **التوافق:** تثبيت مباشر وتحديث فوق النسخة المثبتة حاليًا دون فقدان المحادثات أو الإعدادات.
          - **المميزات:** دعم كامل للغة العربية والاتجاه من اليمين لليسار (RTL) واختيار لغة التطبيق.
          "

          echo "Publishing GitHub Release: $TAG_NAME"
          gh release create "$TAG_NAME" \
            --title "$RELEASE_TITLE" \
            --notes "$NOTES" \
            app/build/outputs/apk/release/app-universal-release.apk \
            app/build/outputs/apk/release/app-arm64-v8a-release.apk \
            app/build/outputs/apk/release/app-x86_64-release.apk || \
          gh release upload "$TAG_NAME" \
            app/build/outputs/apk/release/app-universal-release.apk \
            app/build/outputs/apk/release/app-arm64-v8a-release.apk \
            app/build/outputs/apk/release/app-x86_64-release.apk --clobber

      - name: Remove release-only files
        if: always()
        run: rm -f arabic-release.keystore local.properties
