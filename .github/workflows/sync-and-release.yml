name: Sync upstream and release Arabic APK

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: arabic-upstream-release
  cancel-in-progress: false

jobs:
  sync-build-release:
    runs-on: ubuntu-latest
    env:
      RELEASE_VERSION: 1.0.${{ github.run_number }}
      RELEASE_CODE: ${{ github.run_number }}
    steps:
      - name: Checkout Arabic fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Configure upstream
        run: |
          git remote add upstream https://github.com/rikkahub/rikkahub.git || true
          git fetch upstream master

      - name: Merge official upstream
        run: |
          echo "before=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          git merge upstream/master --no-edit

      - name: Detect source changes
        id: changed
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "$before" != "$(git rev-parse HEAD)" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate Arabic resource completeness
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          def keys(p):
              return set(re.findall(r'<string\s+name="([^"]+)"', Path(p).read_text()))
          base = keys('app/src/main/res/values/strings.xml')
          ar = keys('app/src/main/res/values-ar/strings.xml')
          missing = sorted(base - ar)
          if missing:
              raise SystemExit('Arabic translation missing keys:\n' + '\n'.join(missing))
          print(f'Arabic resource covers {len(base)} base strings')
          PY

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Restore signing key
        if: steps.changed.outputs.changed == 'true'
        env:
          KEYSTORE_B64: ${{ secrets.ARABIC_RELEASE_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.ARABIC_RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ARABIC_RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ARABIC_RELEASE_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_B64" || (echo 'Missing Arabic release signing secrets' >&2; exit 1)
          echo "$KEYSTORE_B64" | base64 --decode > arabic-release.keystore
          cat >> local.properties <<EOF
          storeFile=$GITHUB_WORKSPACE/arabic-release.keystore
          storePassword=$STORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - name: Restore Google Services configuration
        if: steps.changed.outputs.changed == 'true'
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          test -n "$GOOGLE_SERVICES_JSON" || (echo 'Missing GOOGLE_SERVICES_JSON repository secret; create a Firebase Android app for me.rerere.rikkahub.arabic and add the downloaded JSON as a secret.' >&2; exit 1)
          printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json

      - name: Build signed universal APK
        if: steps.changed.outputs.changed == 'true'
        run: ./gradlew :app:assembleRelease -PreleaseVersion="$RELEASE_VERSION" -PreleaseCode="$RELEASE_CODE"

      - name: Push validated upstream merge
        if: steps.changed.outputs.changed == 'true'
        run: git push origin master

      - name: Publish GitHub Release
        if: steps.changed.outputs.changed == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.RELEASE_VERSION }}
          name: RikkaHub Arabic v${{ env.RELEASE_VERSION }}
          generate_release_notes: true
          files: app/build/outputs/apk/release/*.apk

      - name: Remove release-only files
        if: always()
        run: rm -f app/google-services.json arabic-release.keystore local.properties
